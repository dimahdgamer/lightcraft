[package]
name = "lightcraft-nextcloud"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LightCraft Nextcloud: WebDAV paths, listings and credentials in pure Rust (L1)"

[lints]
workspace = true

[dependencies]
quick-xml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# transfers run natively only (lightcraft-fetch is empty on wasm32)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lightcraft-fetch = { workspace = true }

[features]
# An in-memory WebDAV server on 127.0.0.1 for tests of the crates above this one.
test-server = []

[dev-dependencies]
proptest = { workspace = true }
